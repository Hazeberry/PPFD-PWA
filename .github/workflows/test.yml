name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      repetitions:
        description: 'Durchläufe je Kamera-Szenario (1–20)'
        type: choice
        default: '10'
        options: ['1', '5', '10', '20']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test tests/test_browser_support.js

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          BROWSER_TEST_REPEATS: ${{ inputs.repetitions || '1' }}
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser/
          if-no-files-found: warn
          retention-days: 7
