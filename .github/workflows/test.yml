name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      repetitions:
        description: 'Durchläufe je Kamera-Szenario (1–20)'
        type: choice
        default: '10'
        options: ['1', '5', '10', '20']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test tests/test_browser_support.js

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify failure diagnostics (temporary)
        run: |
          cp tests/test_browser.js /tmp/test_browser.original.js
          python3 - <<'PYTEST'
          from pathlib import Path
          p = Path('tests/test_browser.js')
          s = p.read_text()
          assert "assert.equal(mode, 'Manuell');" in s
          p.write_text(s.replace("assert.equal(mode, 'Manuell');", "assert.fail('intentional diagnostics self-test');"))
          PYTEST
          set +e
          npm run test:browser
          result=$?
          set -e
          cp /tmp/test_browser.original.js tests/test_browser.js
          test "$result" -eq 1
          test -s test-results/browser/run-1-camera/screenshot.png
          unzip -t test-results/browser/run-1-camera/trace.zip
          node -e "const s=require('./test-results/browser/summary.json');if(s.failed!==1||s.passed!==1)process.exit(1)"
          mv test-results/browser test-results/diagnostic-self-test
      - run: npm run test:browser
        env:
          BROWSER_TEST_REPEATS: ${{ inputs.repetitions || '10' }}
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
